name: Build Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: lyrics-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare release signing
        env:
          LYRICS_KEYSTORE_BASE64: ${{ secrets.LYRICS_KEYSTORE_BASE64 }}
          LYRICS_KEYSTORE_PASSWORD: ${{ secrets.LYRICS_KEYSTORE_PASSWORD }}
          LYRICS_KEY_ALIAS: ${{ secrets.LYRICS_KEY_ALIAS }}
          LYRICS_KEY_PASSWORD: ${{ secrets.LYRICS_KEY_PASSWORD }}
        run: |
          test -n "$LYRICS_KEYSTORE_BASE64"
          test -n "$LYRICS_KEYSTORE_PASSWORD"
          test -n "$LYRICS_KEY_ALIAS"
          test -n "$LYRICS_KEY_PASSWORD"
          printf '%s' "$LYRICS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lyrics-release.jks"

      - name: Build signed release APK
        env:
          LYRICS_KEYSTORE_FILE: ${{ runner.temp }}/lyrics-release.jks
          LYRICS_KEYSTORE_PASSWORD: ${{ secrets.LYRICS_KEYSTORE_PASSWORD }}
          LYRICS_KEY_ALIAS: ${{ secrets.LYRICS_KEY_ALIAS }}
          LYRICS_KEY_PASSWORD: ${{ secrets.LYRICS_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Publish signed GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          tag="build-${GITHUB_SHA:0:12}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" app/build/outputs/apk/release/app-release.apk \
              --target "$GITHUB_SHA" \
              --title "Lyrics ${tag}" \
              --notes "Signed release APK built from commit ${GITHUB_SHA}."
          fi
