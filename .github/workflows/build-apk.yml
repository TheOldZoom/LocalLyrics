name: Build Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: lyrics-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare release signing
        env:
          LYRICS_KEYSTORE_BASE64: ${{ secrets.LYRICS_KEYSTORE_BASE64 }}
          LYRICS_KEYSTORE_PASSWORD: ${{ secrets.LYRICS_KEYSTORE_PASSWORD }}
          LYRICS_KEY_ALIAS: ${{ secrets.LYRICS_KEY_ALIAS }}
          LYRICS_KEY_PASSWORD: ${{ secrets.LYRICS_KEY_PASSWORD }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -n "$LYRICS_KEYSTORE_BASE64"
          test -n "$LYRICS_KEYSTORE_PASSWORD"
          test -n "$LYRICS_KEY_ALIAS"
          test -n "$LYRICS_KEY_PASSWORD"
          printf '%s' "$LYRICS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lyrics-release.jks"

      - name: Build signed release APK
        env:
          LYRICS_KEYSTORE_FILE: ${{ runner.temp }}/lyrics-release.jks
          LYRICS_KEYSTORE_PASSWORD: ${{ secrets.LYRICS_KEYSTORE_PASSWORD }}
          LYRICS_KEY_ALIAS: ${{ secrets.LYRICS_KEY_ALIAS }}
          LYRICS_KEY_PASSWORD: ${{ secrets.LYRICS_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Stage signed APK for release review
        uses: actions/upload-artifact@v7
        with:
          name: lyrics-signed-release-candidate
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
